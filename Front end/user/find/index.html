<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Master Shop - Trang Chủ</title>
    <link rel="stylesheet" href="/user/css/style.css"> <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">PC MASTER</div>
        
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Bạn tìm gì hôm nay? (VD: RTX 4090...)">
            <button onclick="handleSearch()"><i class="fas fa-search"></i> Tìm kiếm</button>
        </div>

        <div class="user-actions" id="user-info">
            </div>
        
        <div class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span class="badge">0</span>
            <span>Giỏ hàng</span>
        </div>
    </header>

    <div class="shop-container">
        
        <aside class="sidebar">
            <div class="filter-section">
                <h3>Mức giá</h3>
                <div class="price-inputs">
                    <input type="number" placeholder="Từ" id="min-price">
                    <span>-</span>
                    <input type="number" placeholder="Đến" id="max-price">
                </div>
                <button class="btn-filter" onclick="applyFilters()">Áp dụng</button>
            </div>

            <div class="filter-section">
                <h3>Thương hiệu</h3>
                <label class="checkbox-item"><input type="checkbox" value="NVIDIA"> NVIDIA</label>
                <label class="checkbox-item"><input type="checkbox" value="Intel"> Intel</label>
                <label class="checkbox-item"><input type="checkbox" value="AMD"> AMD</label>
                <label class="checkbox-item"><input type="checkbox" value="Corsair"> Corsair</label>
                <label class="checkbox-item"><input type="checkbox" value="Asus"> Asus</label>
            </div>

            <div class="filter-section">
                <h3>Loại linh kiện</h3>
                <label class="checkbox-item"><input type="checkbox" value="GPU"> Card màn hình (GPU)</label>
                <label class="checkbox-item"><input type="checkbox" value="CPU"> Vi xử lý (CPU)</label>
                <label class="checkbox-item"><input type="checkbox" value="RAM"> RAM</label>
                <label class="checkbox-item"><input type="checkbox" value="Mainboard"> Bo mạch chủ</label>
            </div>
        </aside>

        <main class="main-content">
            <div class="sort-bar">
                <h2 id="total-products">Linh Kiện PC (0 sản phẩm)</h2>
                <div class="sort-options">
                    <span>Sắp xếp theo:</span>
                    <button onclick="sortProducts('price-asc')">Giá tăng dần</button>
                    <button onclick="sortProducts('price-desc')">Giá giảm dần</button>
                    <button onclick="sortProducts('name-asc')">Tên A-Z</button>
                </div>
            </div>

            <div id="product-grid" class="product-grid">
                </div>
        </main>
    </div>

    <script src="/user/js/find.js"></script>
</body>
</html>
