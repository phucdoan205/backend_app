<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - PC Master</title>
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">PC MASTER</div>
        <div class="user-actions" id="user-info"></div> </header>

    <div class="shop-container cart-page">
        
        <div class="cart-items-wrapper">
            <h2>Giỏ hàng của bạn</h2>
            
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Xóa</th>
                    </tr>
                </thead>
                <tbody id="cart-body">
                    </tbody>
            </table>
            
            <a href="../index.html" class="continue-shopping"><i class="fas fa-arrow-left"></i> Tiếp tục mua sắm</a>
        </div>

        <div class="cart-summary">
            <h3>Thông tin đơn hàng</h3>
            
            <div class="summary-row">
                <span>Tạm tính:</span>
                <span id="temp-total">0₫</span>
            </div>
            <div class="summary-row total">
                <span>Tổng cộng:</span>
                <span id="final-total">0₫</span>
            </div>

            <p class="vat-note">(Đã bao gồm VAT nếu có)</p>

            <button class="btn-checkout" onclick="alert('Chức năng thanh toán đang phát triển!')">THANH TOÁN NGAY</button>
            
            <div class="order-note">
                <label>Ghi chú đơn hàng</label>
                <textarea placeholder="Nhập ghi chú (VD: Giao hàng giờ hành chính...)"></textarea>
            </div>
            
            <div class="trust-badges">
                <p><i class="fas fa-check-circle"></i> Hàng chính hãng 100%</p>
                <p><i class="fas fa-shield-alt"></i> Bảo hành tận nơi</p>
            </div>
        </div>
    </div>
    <div id="checkoutModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:10px; width:400px; position:relative;">
            <h2 style="margin-top:0; color:#333;">Thông Tin Giao Hàng</h2>
            
            <form id="checkoutForm">
                <div style="margin-bottom:15px;">
                    <label>Họ và Tên:</label>
                    <input type="text" id="custName" required style="width:100%; padding:8px; margin-top:5px; border:1px solid #ddd; border-radius:4px;">
                </div>
                <div style="margin-bottom:15px;">
                    <label>Số điện thoại:</label>
                    <input type="tel" id="custPhone" required style="width:100%; padding:8px; margin-top:5px; border:1px solid #ddd; border-radius:4px;">
                </div>
                <div style="margin-bottom:15px;">
                    <label>Địa chỉ nhận hàng:</label>
                    <textarea id="custAddress" required style="width:100%; padding:8px; margin-top:5px; border:1px solid #ddd; border-radius:4px; height:80px;"></textarea>
                </div>
                
                <div style="display:flex; justify-content:flex-end; gap:10px;">
                    <button type="button" onclick="closeModal()" style="padding:8px 15px; border:none; background:#ccc; cursor:pointer; border-radius:4px;">Hủy</button>
                    <button type="submit" style="padding:8px 20px; border:none; background:#e74c3c; color:white; font-weight:bold; cursor:pointer; border-radius:4px;">XÁC NHẬN MUA</button>
                    </div>
                </form>
            </div>
        </div>
    <script src="../../admin/js/config.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/data.js"></script>

    
    <script>
        // Script nhỏ để check login header giống trang chủ
        const userStr = localStorage.getItem('currentUser');
        const userInfoDiv = document.getElementById('user-info');
        if (userStr && userInfoDiv) {
            const user = JSON.parse(userStr);
            userInfoDiv.innerHTML = `<span>Xin chào, <b>${user.username}</b></span>`;
        } else if(userInfoDiv) {
            userInfoDiv.innerHTML = `<a href="login.html">Đăng nhập</a>`;
        }
    </script>
</body>
</html>
