<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Quản lý sản phẩm</title>
  <link rel="stylesheet" href="./css/product.css" />
</head>

<body>
  <div class="header">
    <h2>Quản lý sản phẩm (Admin)</h2>
    <button onclick="logout()">Đăng xuất</button>
  </div>

  <h3>Thêm / Sửa sản phẩm</h3>

  <input id="pId" type="hidden" />

  <input id="pName" placeholder="Tên" /><br />
  <input id="pPrice" type="number" placeholder="Giá" /><br />
  <input id="pStock" type="number" placeholder="Tồn kho" /><br />
  <textarea id="pDesc" placeholder="Mô tả"></textarea><br />

  <button onclick="save()">Lưu</button>
  <button onclick="clearForm()">Clear</button>

  <h3>Danh sách sản phẩm</h3>

  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Mô tả</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <script src="./js/product.js"></script>
</body>
</html>
