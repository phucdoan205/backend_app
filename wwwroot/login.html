<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập System</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-wrapper">
        <div class="bg-particle"></div>
        <div class="bg-particle"></div>

        <div class="login-box">
            <h2>SYSTEM ACCESS</h2>
            
            <form id="loginForm">
                <div class="user-box">
                    <input type="text" id="username" required autocomplete="off">
                    <label>Username</label>
                </div>
                <div class="user-box">
                    <input type="password" id="password" required>
                    <label>Password</label>
                </div>
                
                <button type="submit" class="btn-neon">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    Đăng Nhập
                </button>
                <div class="register-link">
    <p>Chưa có tài khoản? <a href="./register/register.html">Đăng ký ngay</a></p>
</div>
            </form>

            <p id="error-msg"></p>
            <a href="./user/index.html" class="back-link">← Quay lại trang chủ</a>
        </div>
    </div>
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <h3 class="success-text">Đăng nhập thành công!</h3>
        <p>Đang chuyển hướng...</p>
    </div>
    <script src="js/login.js?v=2"></script> <!-- v=2 khiến trình duyệt tưởng là file mới -->
</body>
</html>
