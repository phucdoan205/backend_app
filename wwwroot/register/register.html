<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản</title>
    <link rel="stylesheet" href="./style.css"> 
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1>ĐĂNG KÝ</h1>
                <p>Tạo tài khoản thành viên PC MASTER</p>
            </div>
            <form id="registerForm">
                <div class="input-group">
                    <input type="text" id="regUsername" placeholder="Tên đăng nhập" required>
                </div>
                <div class="input-group">
                    <input type="email" id="regEmail" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" placeholder="Mật khẩu" required>
                </div>
                <div class="input-group">
                    <input type="password" id="regConfirmPass" placeholder="Nhập lại mật khẩu" required>
                </div>
                
                <button type="submit" class="btn-login" id="btnRegister">ĐĂNG KÝ NGAY</button>
                
                <p class="error-msg" id="regMessage" style="margin-top: 15px; font-weight: bold; text-align: center; min-height: 20px;"></p>
                
                <div style="margin-top: 20px;">
                    <a href="../login.html" style="text-decoration: none; color: #e67e22;">Đã có tài khoản? Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../admin/js/config.js"></script>
    <script src="../js/api_register.js"></script>
</body>
</html>
